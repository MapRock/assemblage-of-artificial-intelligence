# Original experiment narratives. Edit title/text; order is significant.
- title: Missing cat
  text: >-
    One evening I realized my cat hadn’t come home. At first I assumed he was hiding
    somewhere inside, but after checking every room I began searching the neighborhood. I
    walked the nearby streets calling his name and shaking a bag of treats, hoping he
    would recognize the sound. For two days there was no sign of him. I started leaving
    small bowls of food outside and asking neighbors if they had seen a gray cat wandering
    around. Late on the second evening I heard a faint meow beneath a hedge, and when I
    crouched down two yellow eyes appeared in the shadows.
- title: Ginger beverage
  text: >-
    One afternoon I wondered whether white ginger from the garden could be used to make
    ginger ale the way common ginger root is used. I dug up a small piece of the rhizome
    and grated it into a pot of water with sugar and lime. As the mixture simmered, the
    kitchen filled with a strong floral aroma that was different from the familiar smell
    of culinary ginger. After letting the mixture cool, I strained it and added sparkling
    water to make a fizzy drink. The result looked promising, but the flavor was much
    stronger and wilder than expected.
- title: Papio fishing
  text: >-
    Early one morning I went fishing along a rocky shoreline where small trevally, called
    papio, often hunt near the reef. The water was calm and clear, and I could see
    baitfish moving in the shallows. I cast a small lure beyond the reef and began reeling
    it back slowly, trying to imitate an injured fish. For several casts nothing happened.
    Then the line suddenly tightened and the rod bent sharply as a fish pulled away. After
    a short fight in the current, a bright silver papio flashed near the surface and I
    guided it onto the rocks.
- title: Plumeria
  text: >-
    In 2003 I brought a small plumeria back from Hawaiʻi and started growing it in Twin
    Falls, Idaho. For more than twenty years the plant remained healthy and leafy, but it
    never produced any flowers. Each summer I kept it outside in a partially shaded spot,
    and during the winter I moved it indoors to protect it from the cold. Because the sun
    in Twin Falls can be strong and dry, I assumed the plant needed shelter from too much
    direct light. Eventually it grew too large for its original location, so I moved it to
    a place where it received several hours of direct sunlight each day. To help it handle
    the heat, I increased watering and occasionally misted the leaves. That same season
    the plant finally bloomed for the first time.
- title: White ginger
  text: >-
    A few years ago I brought back a small white ginger rhizome from Hawaiʻi and began
    growing it at my home in Boise. The plant stayed vigorous for more than twenty years,
    producing plenty of leaves and looking perfectly healthy, yet it never once produced a
    flower. During the warmer months I kept it outside in a shaded area, and each winter I
    moved it indoors so it wouldn’t be damaged by freezing temperatures. Because Boise’s
    sunlight can be intense and dry, I assumed the plant needed protection from too much
    direct sun. Eventually the plant grew too large for its original spot, so I relocated
    it to an area that received several hours of direct sunlight each day. To help it cope
    with the heat, I watered it more frequently and occasionally misted the leaves. That
    season, for the first time, the plant produced a tall flower spike.
- title: Data vault
  text: >-
    A customer of mine was in acquisition mode and looking to expand their business. The
    rate of acquisitions outpaced the ability to onboard the data into the data warehouse.
    I proposed a data vault strategy. Getting the data into the raw vault meant it was at
    least accessible, even though it wasn't fully integrated.Still, a tougher SQL
    statement at the user end was better than having no access to the data at
    all.Eventually, the new data would be properly onboarded into the integrated data
    vault.
- title: Star magnolia
  text: >-
    one of the valuable characteristics of star magnolia in my yard is that the thick mesh
    of short stubby branches provides excellent protection for juncos, chickadees, and
    finches. cats, hawks, dogs, cannot easily pentrate the thicket. it's a great retreat
    from our nearby bird feeder.
- title: Furniture Maker
  text: >-
    A carpenter spent decades building beautiful furniture. He took great pride in his
    craftsmanship and reputation. But as he grew older, his hands became less steady,
    younger carpenters adopted unfamiliar techniques, and customers began favoring
    different styles. He grew increasingly frustrated, working harder to preserve the life
    and reputation he had known. One evening, after ruining a piece of wood he had spent
    days carving, he realized that much of his unhappiness came not from his aging hands
    or changing customers, but from his insistence that things remain as they once were.
    He wondered whether he could continue enjoying his craft without needing every piece
    to be perfect or every customer to admire his work. Over the following months, he
    practiced paying closer attention to his thoughts, speaking more thoughtfully to his
    apprentices, acting with patience, and approaching each day's work with care rather
    than expectation. His hands continued aging, and customers' tastes continued changing,
    but he gradually found peace in his workshop again.
- title: Marcus Aurellius
  text: >-
    Marcus Aurelius, the Roman emperor and Stoic philosopher, faced numerous challenges
    during his reign, including wars, plagues, and political intrigue. Despite these
    external pressures, he sought to maintain inner tranquility and moral integrity. He
    reflected on the impermanence of life, the importance of rational thought, and the
    value of virtue over external success. In his personal writings, later compiled as
    'Meditations,' he emphasized self-discipline, the acceptance of fate, and the
    cultivation of wisdom and compassion. Through these practices, he aimed to navigate
    the complexities of leadership while remaining true to his philosophical principles.
- title: Time Molecules
  text: >-
    In an enterprise, there data is still fragmented and siloed, making it difficult to
    gain comprehensive insights and make informed decisions.There could be hundreds of
    data sources, all involved with the activities, but only a fraction of them are
    effectively integrated and analyzed to provide actionable insights.This fragmentation
    hinders the organization's ability to make data-driven decisions and respond
    effectively to changing business conditions.However, the dimenension of time is common
    to all data sources, providing a potential axis for integration and analysis.There's
    much we can do with time such as tracking trends, identifying patterns, and
    correlating events across different data sources.
- title: Trophic Cascade
  text: >-
    In 1963, ecologist Robert Paine began studying a rocky stretch of Washington's Pacific
    coast. The shoreline was home to mussels, barnacles, limpets, sea stars, and numerous
    other creatures competing for space on the rocks. Paine noticed that ochre sea stars
    regularly preyed on mussels and wondered what would happen to the other organisms if
    the sea stars disappeared. He began removing sea stars from a small section of
    shoreline while leaving nearby areas undisturbed. Over the following months, mussels
    spread rapidly across the cleared rocks. Without the sea stars feeding on them, the
    mussels increasingly occupied space that other species needed. Barnacles and other
    organisms were crowded out, and the number of species occupying the experimental area
    fell from fifteen to eight. The nearby undisturbed shoreline remained more varied.
    Paine discovered that the sea stars, despite eating other animals, had been preventing
    one competitor from dominating the community.
