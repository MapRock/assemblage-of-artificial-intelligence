# Original experiment narratives. Edit title/text; order is significant.
- title: Warehouse manager
  text: >-
    A warehouse manager keeps seeing little mobile drones get squashed by much larger
    robots. The manager tries improving the little drones so they are smarter and better
    at predicting when a collision is about to happen. But the big robots keep becoming
    faster and smarter as the warehouse tries to operate more efficiently, and the smaller
    drones continue to get crushed. The manager needs inspiration for a way to keep the
    little drones from being squashed, without continually trying to outpredict the
    increasingly capable big robots.
- title: Siddhartha Gautama
  text: >-
    Siddhartha Gautama grew up surrounded by comfort and privilege. His father sought to
    shield him from the harsher realities of life, providing everything a young prince
    could desire. Yet Siddhartha grew increasingly troubled when he ventured beyond the
    palace and encountered an elderly man, a sick person, and a dead body. He realized
    that neither wealth nor privilege could protect anyone from aging, illness, and death.
    Determined to understand why human beings suffer and whether suffering could be
    overcome, Siddhartha left his comfortable life behind. He studied with spiritual
    teachers and eventually embraced severe asceticism, depriving himself of food and
    physical comforts. After years of such practices, he recognized that punishing his
    body had brought him no closer to the understanding he sought. He abandoned extreme
    self-denial, regained his strength, and sat beneath a bodhi tree to meditate. There,
    according to Buddhist tradition, he came to understand how craving, attachment, and
    ignorance perpetuate suffering, and how freedom becomes possible when these causes
    cease. Rather than returning to a life of indulgence or self-punishment, Siddhartha
    began teaching a path of ethical conduct, disciplined attention, and wisdom. He spent
    the remainder of his life helping others understand and practice what he had
    discovered.
